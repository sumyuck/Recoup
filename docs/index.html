<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recoup — Razorpay AI Buildathon Pitch</title>
  <style>
    :root { color-scheme: dark; --bg:#07101f; --panel:#101d33; --blue:#528ff0; --muted:#aab7cc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 5%,#14294a 0,#07101f 45%); color:#f5f7fb; font:16px/1.5 Inter,system-ui,sans-serif; }
    main { width:min(1120px,92vw); margin:0 auto; padding:56px 0 72px; }
    .eyebrow { color:var(--blue); font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:.35rem 0 .4rem; font-size:clamp(2.5rem,7vw,5.4rem); line-height:1; }
    p { color:var(--muted); font-size:clamp(1rem,2vw,1.25rem); max-width:760px; }
    .video { margin-top:36px; padding:12px; border:1px solid #263b5d; border-radius:20px; background:var(--panel); box-shadow:0 30px 80px #0008; }
    video { display:block; width:100%; border-radius:12px; background:#000; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
    a { color:#fff; text-decoration:none; padding:10px 16px; border-radius:10px; background:#1b2c48; font-weight:700; }
    a.primary { background:var(--blue); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Razorpay AI Buildathon · Track 03</div>
    <h1>Recoup</h1>
    <p>A bounded revenue-recovery agent that proves how much money it actually made. Pitch runtime: 4 minutes 7 seconds.</p>
    <div class="video"><video controls preload="metadata" src="Recoup-Pitch.mp4"></video></div>
    <nav>
      <a class="primary" href="https://github.com/sumyuck/Recoup">View public repository</a>
      <a href="https://github.com/sumyuck/Recoup/blob/main/RESULTS.md">Read measured results</a>
    </nav>
  </main>
</body>
</html>
